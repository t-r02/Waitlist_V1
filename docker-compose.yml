# Run the full stack:  docker compose up -d --build
# All three Spring services wait for their infra dependencies to pass
# healthchecks before starting, so the order is deterministic.

# ─────────────────────────────────────────────────────────────────────────────
# Infrastructure
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: waitlist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d waitlist"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Kafka (KRaft — no Zookeeper) ────────────────────────────────────────────
  # KRaft combines the broker and controller roles in a single node.
  # Two named listeners keep container ↔ container traffic off localhost:
  #   INTERNAL  kafka:29092   used by Spring services inside the Docker network
  #   EXTERNAL  localhost:9092 used by host-side tools (Kafka UI, IDE, curl)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # A fixed, deterministic cluster UUID so restarts don't re-format storage.
      # Generate your own with: kafka-storage random-uuid
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      # kafka-topics --list succeeds only once the broker is fully elected
      # and ready to accept metadata requests.
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s   # give KRaft time to elect the controller before counting failures

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Mail (Mailpit — maintained Alpine-based drop-in for MailHog) ────────────
  # Same SMTP port (1025) and web UI port (8025) as MailHog.
  # /api/v2/messages endpoint is API-compatible with MailHog.
  # Alpine base lets the healthcheck use wget.
  mailpit:
    image: axllent/mailpit:v1.21.3
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI / REST API
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/messages || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

# ─────────────────────────────────────────────────────────────────────────────
# Application services
# Build context is always the repo root so the :events sub-project is
# available on the classpath during gradle :*:bootJar.
# ─────────────────────────────────────────────────────────────────────────────

  ingestion-service:
    build:
      context: .
      dockerfile: ingestion-service/Dockerfile
    ports:
      - "8081:8081"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: waitlist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379

  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    ports:
      - "8082:8082"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: waitlist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      KAFKA_BOOTSTRAP: kafka:29092
      # Override with a real secret in production (≥ 32 bytes for HS256).
      # Set JWT_SECRET in your shell or a .env file before running compose.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-32b}

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8083:8083"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: waitlist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      KAFKA_BOOTSTRAP: kafka:29092
      MAIL_HOST: mailpit
      MAIL_PORT: 1025

# ─────────────────────────────────────────────────────────────────────────────
# Named volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
