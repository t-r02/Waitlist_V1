spring:
  application:
    name: admin-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:waitlist}?currentSchema=admin
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: admin
  flyway:
    schemas: admin
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: "true"
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        spring.json.type.mapping: "status-changed-event:com.waitlist.events.StatusChangedEvent"
    consumer:
      group-id: admin-service
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "signup-event:com.waitlist.events.SignupEvent"
    listener:
      ack-mode: RECORD

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-must-be-at-least-32-bytes-long-for-hs256}
    expiry-minutes: 1440
  kafka:
    error-handler:
      initial-interval-ms: 1000
      max-interval-ms: 10000
      max-retries: 3

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
